x-drone: &drone
  image: flocking-drone
  init: true
  volumes:
    - ${ARDUPILOT:-${HOME}/code/ardupilot}/build/sitl/bin/arducopter:/app/bin/arducopter:ro
    - ${ARDUPILOT:-${HOME}/code/ardupilot}/Tools/autotest/default_params/copter.parm:/app/defaults.parm:ro
    - ..:/app/flocking:ro
    - ./drone/start.sh:/app/start.sh:ro

x-air: &air
  ALTITUDE: 3.0
  REQUEST: ${REQUEST:-0.0 0.0 0.0}
  ROS_DOMAIN_ID: 7

services:
  uav1:
    <<: *drone
    build: ./drone
    environment: { <<: *air, DRONE_ID: 1 }
  uav2:
    <<: *drone
    environment: { <<: *air, DRONE_ID: 2 }
  uav3:
    <<: *drone
    environment: { <<: *air, DRONE_ID: 3 }
  uav4:
    <<: *drone
    environment: { <<: *air, DRONE_ID: 4 }
